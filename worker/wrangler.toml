name = "trittico-checkout"
main = "checkout.js"
compatibility_date = "2024-01-01"

# Deploy with: npx wrangler deploy
# Set secrets with:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put KITCHEN_TOKEN         (optional — set any password you like)

# KV Namespace binding for order storage
# Setup:
#   1. Go to Cloudflare Dashboard → Workers & Pages → KV
#   2. Click "Create namespace", name it "trittico-orders"
#   3. Copy the ID and paste it below (replace YOUR_KV_NAMESPACE_ID)
#   4. Run: npx wrangler deploy
[[kv_namespaces]]
binding = "ORDERS_KV"
id      = "YOUR_KV_NAMESPACE_ID"
